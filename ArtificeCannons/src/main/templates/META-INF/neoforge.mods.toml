modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="irons_artifice"
    type="required"
    versionRange="[1.21.1-1.1.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.9.3,)"
    ordering="NONE"
    side="BOTH"

# Electricity module: only registers when these are present.
[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="electroenergetics"
    type="optional"
    versionRange="[1.1,)"
    ordering="AFTER"
    side="BOTH"
